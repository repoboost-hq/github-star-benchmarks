<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="ttl dsc"><title id="ttl">Age of GitHub repositories with 1,000 or more stars</title><desc id="dsc">Stacked bar: 61.5% created before 2020, 18.1% in 2020-2022, 10.5% in 2023-2024, 9.9% in 2025 or later.</desc><rect width="840" height="300" rx="18" fill="#0A0D11"/><filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity=".25"/></filter>
